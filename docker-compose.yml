# API and database run in SEPARATE containers on a private network.
#   docker compose up --build
#   docker compose exec api python -m app.seed      # optional demo data
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-boutique}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-boutique}
      POSTGRES_DB: ${POSTGRES_DB:-boutique}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # No "ports:" on purpose: only the API container can reach the database.
    # Uncomment to inspect it from your machine with psql or a GUI:
    # ports:
    #   - "127.0.0.1:5432:5432"

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-boutique}:${POSTGRES_PASSWORD:-boutique}@db:5432/${POSTGRES_DB:-boutique}
    ports:
      - "8000:8000"

volumes:
  pgdata:
